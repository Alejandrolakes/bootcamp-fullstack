<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>Piedra, Papel o Tijera</title>
</head>
<body>

  <div class="contenedor">
    <h1>Piedra, Papel o Tijera</h1>

    <div class="botones">
      <button onclick="jugar('piedra')">🪨 Piedra</button>
      <button onclick="jugar('papel')">📄 Papel</button>
      <button onclick="jugar('tijera')">✂️ Tijera</button>
    </div>

    <div class="resultado">
      <p id="eleccion-usuario">Tu elección: -</p>
      <p id="eleccion-pc">Elección del computador: -</p>
      <p id="mensaje">Resultado: -</p>
    </div>

    <div class="marcador">
      <p>Jugador: <span id="puntos-usuario">0</span></p>
      <p>PC: <span id="puntos-pc">0</span></p>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
